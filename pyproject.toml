[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosleepclub-datamate"
version = "0.2.1"
description = "Conservative deterministic DataMate baseline and local research utilities; not an official scorer."
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
nosleepclub-datamate = "nosleepclub_datamate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosleepclub-datamate"
version = "0.1.0"
description = "Offline research utilities for DataMate development; not an official scorer or inference system."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nosleepclub-datamate = "nosleepclub_datamate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

name: baseline-and-foundation-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and XLSX dependency
        run: python -m pip install .
      - name: Test baseline and utilities on synthetic data
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run documented synthetic summary
        env:
          PYTHONPATH: src
        run: python -m nosleepclub_datamate summarize examples/verdicts.synthetic.jsonl --expected-total 5
